name: Unity CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Unity Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # FIX 1: Provide virtual RAM space to offset Unity's high allocation peaks
      - name: Set up Swap Space (Prevents Exit Code 137)
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 12

      # FIX 2: Cache Unity's Library directory to drastically cut build durations
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      # Display available runner resources
      - name: Check runner resources
        run: |
          echo "===== MEMORY ====="
          free -h
          echo "===== DISK ====="
          df -h
          echo "===== UNITY VERSION ====="
          cat ProjectSettings/ProjectVersion.txt

      # Create build version
      - name: Set build version
        run: |
          echo "BUILD_VERSION=0.2.${{ github.run_number }}" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

       Sir-name: Display build information
        run: |
          echo "Game Version: $BUILD_VERSION"
          echo "Git Commit: $COMMIT_SHA"

      # Build Unity project
      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: TitanGlitch
          versioning: Custom
          version: ${{ env.BUILD_VERSION }}

          # FIX 3: Re-align the container limits to play nice with host resources
          dockerMemoryLimit: 14g
          dockerCpuLimit: 2

          # FIX 4: Clamp concurrent shader pipelines down to level out RAM spike plateaus
          customParameters: "-mshc 2"

      # Try to determine whether Linux killed Unity because of memory
      - name: Show failure diagnostics
        if: failure()
        run: |
          echo "===== MEMORY AFTER FAILURE ====="
          free -h
          echo "===== DISK AFTER FAILURE ====="
          df -h
          echo "===== POSSIBLE OOM MESSAGES ====="
          sudo dmesg | grep -Ei "out of memory|oom|killed process" || true

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TitanGlitch-StandaloneWindows64-v${{ env.BUILD_VERSION }}
          path: build/StandaloneWindows64
          retention-days: 14
