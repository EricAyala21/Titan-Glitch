name: Unity CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Unity Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Display available runner resources
      - name: Check runner resources
        run: |
          echo "===== MEMORY ====="
          free -h

          echo "===== DISK ====="
          df -h

          echo "===== UNITY VERSION ====="
          cat ProjectSettings/ProjectVersion.txt

      # Create build version
      - name: Set build version
        run: |
          echo "BUILD_VERSION=0.2.${{ github.run_number }}" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Display build information
        run: |
          echo "Game Version: $BUILD_VERSION"
          echo "Git Commit: $COMMIT_SHA"

      # Build Unity project
      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: TitanGlitch
          versioning: Custom
          version: ${{ env.BUILD_VERSION }}

          # Reserve some memory for the GitHub runner itself
          dockerMemoryLimit: 12g
          dockerCpuLimit: 2

      # Try to determine whether Linux killed Unity because of memory
      - name: Show failure diagnostics
        if: failure()
        run: |
          echo "===== MEMORY AFTER FAILURE ====="
          free -h

          echo "===== DISK AFTER FAILURE ====="
          df -h

          echo "===== POSSIBLE OOM MESSAGES ====="
          sudo dmesg | grep -Ei "out of memory|oom|killed process" || true

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TitanGlitch-StandaloneWindows64-v${{ env.BUILD_VERSION }}
          path: build/StandaloneWindows64
          retention-days: 14
