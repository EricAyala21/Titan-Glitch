name: Unity CI

# Run whenever code is pushed or merged into main
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Unity Project
    runs-on: ubuntu-latest

    steps:

      # Download the repository onto the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Cache Unity's Library folder to speed up repeat builds
      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      # Create a unique version number for each build
      - name: Set build version
        run: |
          echo "BUILD_VERSION=0.2.${{ github.run_number }}" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # Display build information in GitHub Actions
      - name: Display build information
        run: |
          echo "Game Version: $BUILD_VERSION"
          echo "Git Commit: $COMMIT_SHA"

      # Build the Unity project
      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: TitanGlitch
          versioning: Custom
          version: ${{ env.BUILD_VERSION }}
          collectUnityLogs: true
          streamUnityLogs: true

      # Upload Unity diagnostic logs even if the build fails
      - name: Upload Unity Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Diagnostics-${{ github.run_number }}
          path: Logs/UnityDiagnostics/
          retention-days: 14
          if-no-files-found: warn

      # Upload the finished game only if the build succeeds
      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TitanGlitch-StandaloneWindows64-v${{ env.BUILD_VERSION }}
          path: build/StandaloneWindows64
          retention-days: 14
