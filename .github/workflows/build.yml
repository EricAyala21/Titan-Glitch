name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  build:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Speeds up repeat builds by reusing Unity's Library/ cache between runs.
      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}
          restore-keys: |
            Library-

      # Build version = MAJOR.MINOR.BUILD, where BUILD is GitHub's own
      # auto-incrementing run number. This guarantees every build has a
      # unique, traceable identifier tied back to the exact commit/run
      # that produced it.
      - name: Compute build version
        id: version
        run: echo "BUILD_VERSION=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: TitanGlitch
          versioning: Custom
          version: ${{ steps.version.outputs.BUILD_VERSION }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TitanGlitch-${{ matrix.targetPlatform }}-v${{ steps.version.outputs.BUILD_VERSION }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 14
