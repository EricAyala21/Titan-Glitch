---
version: 2


updates:
  #Monitor Github Actions Dependencies
  - package-ecosystem: "github-actions"
    directory: "/"

  - schedule:
    interval: "weekly"
    day: "wednesday"
    time: "09:00"
    timezone: "America/Los_Angeles"

commit-message:
  prefix: "Dependabot"

  groups:
    - github-actions:
        patterns:
        - "*"

      