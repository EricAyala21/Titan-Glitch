name: Unity CI

# Run whenever code is pushed/merged into main
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Unity Project
    runs-on: ubuntu-latest

    steps:
      # Download the repository onto the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Create a unique version for this build
      - name: Set build version
        run: |
          echo "BUILD_VERSION=0.2.${{ github.run_number }}" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # Show the version in the GitHub Actions log
      - name: Display build information
        run: |
          echo "Game Version: $BUILD_VERSION"
          echo "Git Commit: $COMMIT_SHA"